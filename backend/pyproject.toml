[project]
name = "dual-weather"
version = "0.1.0"
description = "Dual Weather backend — FastAPI service for saved locations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "mangum>=0.19.0,<0.20",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.5.0,<3",
    "boto3>=1.35.0,<2",
    "google-cloud-firestore>=2.28.0,<3",
    "aws-lambda-powertools[parser]>=3.4.0,<4",
]
# Note: `aws-lambda-powertools` is added here so Plan 2 doesn't have to revisit
# the dependency list. It's unused in this plan; structured-logger config
# happens when we wire up the Lambda runtime.

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "httpx>=0.27.0,<0.28",
    "moto[dynamodb]>=5.0.0,<6",
    "ruff>=0.7.0,<0.8",
    "uvicorn>=0.30.0,<0.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dual_weather"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
